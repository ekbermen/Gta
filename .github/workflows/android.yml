name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Dosyalari klasorlere diz (duz yuklenmis repo icin)
        run: |
          mkdir -p www/js www/css www/models www/data www/assets www/mods
          cp index.html www/
          cp *.glb www/models/
          cp city.xml www/data/
          cp style.css www/css/
          cp icon.png cover.jpg www/assets/
          cp hiz-saat.js para-yagmuru.js komut-bonus.js www/mods/
          for f in extra traffic models city-fallback game online2 weapons7 v6 v7 v8 v9 v10 v11 v12; do cp $f.js www/js/; done
          find www | head -80
      - name: Capacitor kur
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "GTA 67" com.gta67.game --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Yatay mod
        run: sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
      - name: Kotlin cakismasini duzelt
        run: |
          cat >> android/app/build.gradle << 'GRADLE'
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          GRADLE
      - name: APK derle
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gta67-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
